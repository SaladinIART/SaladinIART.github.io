<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Anonymized factory energy monitoring architecture</title>
  <desc id="desc">Industrial energy meters send readings over a field network to resilient edge services, historical storage, and operational dashboards.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7f78"/>
    </marker>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfa"/>
      <stop offset="1" stop-color="#edf5f3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#fbfaf7"/>
  <text x="54" y="55" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" letter-spacing="2" fill="#2f7f78">ANONYMIZED DEPLOYMENT ARCHITECTURE</text>
  <text x="54" y="92" font-family="IBM Plex Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#25304a">From equipment readings to manufacturing decisions</text>

  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <g transform="translate(54 145)">
      <rect width="210" height="155" rx="16" fill="url(#panel)" stroke="#b8d7d1" stroke-width="2"/>
      <circle cx="105" cy="54" r="27" fill="#d8ebe7" stroke="#2f7f78" stroke-width="2"/>
      <path d="M87 59h36M93 48h24M98 70h14" stroke="#2f7f78" stroke-width="4" stroke-linecap="round"/>
      <text x="105" y="110" text-anchor="middle" font-size="19" font-weight="600" fill="#25304a">Energy meters</text>
      <text x="105" y="134" text-anchor="middle" font-size="14" fill="#5d6475">equipment-level readings</text>
    </g>

    <path d="M278 222H335" stroke="#2f7f78" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="306" y="205" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#5d6475">FIELD</text>

    <g transform="translate(350 145)">
      <rect width="210" height="155" rx="16" fill="url(#panel)" stroke="#b8d7d1" stroke-width="2"/>
      <rect x="72" y="30" width="66" height="52" rx="8" fill="#d8ebe7" stroke="#2f7f78" stroke-width="2"/>
      <circle cx="88" cy="56" r="5" fill="#2f7f78"/>
      <path d="M103 48h22M103 62h22" stroke="#2f7f78" stroke-width="3" stroke-linecap="round"/>
      <text x="105" y="110" text-anchor="middle" font-size="19" font-weight="600" fill="#25304a">Edge services</text>
      <text x="105" y="134" text-anchor="middle" font-size="14" fill="#5d6475">collect · validate · recover</text>
    </g>

    <path d="M574 222H631" stroke="#2f7f78" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="602" y="205" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#5d6475">STORE</text>

    <g transform="translate(646 145)">
      <rect width="210" height="155" rx="16" fill="url(#panel)" stroke="#b8d7d1" stroke-width="2"/>
      <ellipse cx="105" cy="39" rx="38" ry="14" fill="#d8ebe7" stroke="#2f7f78" stroke-width="2"/>
      <path d="M67 39v42c0 8 17 14 38 14s38-6 38-14V39M67 60c0 8 17 14 38 14s38-6 38-14" fill="none" stroke="#2f7f78" stroke-width="2"/>
      <text x="105" y="119" text-anchor="middle" font-size="19" font-weight="600" fill="#25304a">Historical data</text>
      <text x="105" y="143" text-anchor="middle" font-size="14" fill="#5d6475">time · equipment · condition</text>
    </g>

    <path d="M870 222H927" stroke="#2f7f78" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="898" y="205" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#5d6475">DECIDE</text>

    <g transform="translate(942 145)">
      <rect width="210" height="155" rx="16" fill="url(#panel)" stroke="#b8d7d1" stroke-width="2"/>
      <rect x="61" y="28" width="88" height="60" rx="7" fill="#fff" stroke="#2f7f78" stroke-width="2"/>
      <path d="M76 70l18-18 14 10 25-24" fill="none" stroke="#2f7f78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="119" text-anchor="middle" font-size="19" font-weight="600" fill="#25304a">Dashboards</text>
      <text x="105" y="143" text-anchor="middle" font-size="14" fill="#5d6475">visibility · reporting · action</text>
    </g>
  </g>

  <text x="54" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#5d6475">Public diagram: site identity, equipment count, commercial figures, and operational configuration intentionally omitted.</text>
</svg>
