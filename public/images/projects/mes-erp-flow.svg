<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="How one factory order flows through Salbotics MES-ERP: an order comes in, the build is planned (BOM and routing), it is made on the floor (work order), quality and output are tracked (OEE, traceability, holds), and everything is shown on dashboards.">
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", "IBM Plex Mono", Menlo, monospace; }
    .plain { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
    .blink { animation: blink 2.2s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      .anim { display: none; }
      .blink { animation: none; }
    }
  </style>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="300" fill="#fbfaf8"/>

  <!-- header bar -->
  <rect x="0" y="0" width="1200" height="40" fill="#f2efe9"/>
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#e2e0d9" stroke-width="1"/>
  <circle cx="24" cy="20" r="6" fill="#2f9c8f"/>
  <text x="42" y="25" font-size="13" fill="#5c6175">salbotics mes-erp · how one factory order flows through the software</text>
  <rect x="1024" y="11" width="152" height="20" rx="10" fill="#faf0db" stroke="#e0a43b"/>
  <text x="1100" y="25" font-size="10" fill="#9a6b16" text-anchor="middle" letter-spacing="0.08em">EXPERIMENTAL · DEMO</text>

  <!-- ===== connectors + animated pulses (drawn under cards; visible in the gaps) ===== -->
  <g stroke="#2f9c8f" stroke-width="2" stroke-dasharray="5 5">
    <line x1="239" y1="156" x2="281" y2="156"/>
    <line x1="464" y1="156" x2="506" y2="156"/>
    <line x1="689" y1="156" x2="731" y2="156"/>
    <line x1="914" y1="156" x2="956" y2="156"/>
  </g>
  <g fill="#2f9c8f">
    <polygon points="281,151 290,156 281,161"/>
    <polygon points="506,151 515,156 506,161"/>
    <polygon points="731,151 740,156 731,161"/>
    <polygon points="956,151 965,156 956,161"/>
  </g>
  <g class="anim" fill="#2f9c8f">
    <circle r="3.2" cy="156"><animate attributeName="cx" values="240;284" dur="1.7s" begin="0s"    repeatCount="indefinite"/></circle>
    <circle r="3.2" cy="156"><animate attributeName="cx" values="465;509" dur="1.7s" begin="0.4s"  repeatCount="indefinite"/></circle>
    <circle r="3.2" cy="156"><animate attributeName="cx" values="690;734" dur="1.7s" begin="0.8s"  repeatCount="indefinite"/></circle>
    <circle r="3.2" cy="156"><animate attributeName="cx" values="915;959" dur="1.7s" begin="1.2s"  repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== plain-English labels (above cards) ===== -->
  <g class="plain" font-size="15.5" font-weight="600" fill="#283044" text-anchor="middle">
    <text x="150"  y="80">An order comes in</text>
    <text x="375"  y="80">Plan the build</text>
    <text x="600"  y="80">Make it on the floor</text>
    <text x="825"  y="80">Track quality &amp; output</text>
    <text x="1050" y="80">See the whole picture</text>
  </g>

  <!-- ===== cards ===== -->
  <g fill="#ffffff" stroke="#e2e0d9" stroke-width="1.4">
    <rect x="65"  y="96" width="170" height="120" rx="12"/>
    <rect x="290" y="96" width="170" height="120" rx="12"/>
    <rect x="515" y="96" width="170" height="120" rx="12"/>
    <rect x="740" y="96" width="170" height="120" rx="12"/>
    <rect x="965" y="96" width="170" height="120" rx="12"/>
  </g>

  <!-- number badges -->
  <g>
    <circle cx="85"  cy="116" r="12" fill="#2f9c8f"/><text x="85"  y="120" font-size="13" fill="#ffffff" text-anchor="middle">1</text>
    <circle cx="310" cy="116" r="12" fill="#2f9c8f"/><text x="310" y="120" font-size="13" fill="#ffffff" text-anchor="middle">2</text>
    <circle cx="535" cy="116" r="12" fill="#2f9c8f"/><text x="535" y="120" font-size="13" fill="#ffffff" text-anchor="middle">3</text>
    <circle cx="760" cy="116" r="12" fill="#2f9c8f"/><text x="760" y="120" font-size="13" fill="#ffffff" text-anchor="middle">4</text>
    <circle cx="985" cy="116" r="12" fill="#2f9c8f"/><text x="985" y="120" font-size="13" fill="#ffffff" text-anchor="middle">5</text>
  </g>

  <!-- ===== icons ===== -->
  <!-- 1 · Order: clipboard -->
  <g fill="none" stroke="#283044" stroke-width="1.5">
    <rect x="140" y="122" width="40" height="48" rx="4" fill="#ffffff"/>
    <rect x="152" y="117" width="16" height="9" rx="2" fill="#e8e6df"/>
  </g>
  <g stroke="#c9c7c0" stroke-width="2" stroke-linecap="round">
    <line x1="147" y1="136" x2="173" y2="136"/><line x1="147" y1="145" x2="173" y2="145"/><line x1="147" y1="154" x2="165" y2="154"/>
  </g>
  <path d="M148 161 l4 4 l8 -10" fill="none" stroke="#2f9c8f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2 · Plan: stacked layers (BOM) + routing dots -->
  <g>
    <rect x="358" y="150" width="44" height="11" rx="2" fill="#ffffff" stroke="#283044" stroke-width="1.3"/>
    <rect x="358" y="138" width="44" height="11" rx="2" fill="#ffffff" stroke="#283044" stroke-width="1.3"/>
    <rect x="358" y="126" width="44" height="11" rx="2" fill="#dff0ed" stroke="#2f9c8f" stroke-width="1.3"/>
  </g>
  <g>
    <line x1="362" y1="172" x2="398" y2="172" stroke="#2f9c8f" stroke-width="1.6"/>
    <circle cx="362" cy="172" r="3" fill="#2f9c8f"/><circle cx="380" cy="172" r="3" fill="#2f9c8f"/><circle cx="398" cy="172" r="3" fill="#2f9c8f"/>
  </g>

  <!-- 3 · Make: machine + tool head + LED -->
  <g>
    <rect x="572" y="128" width="56" height="42" rx="5" fill="#f0eee8" stroke="#283044" stroke-width="1.5"/>
    <rect x="580" y="136" width="24" height="17" rx="2" fill="#ffffff" stroke="#cfcdc6" stroke-width="1.2"/>
    <rect x="610" y="120" width="9" height="22" rx="1.5" fill="#cfcdc6" stroke="#283044" stroke-width="1.2"/>
    <line x1="566" y1="172" x2="634" y2="172" stroke="#283044" stroke-width="2"/>
    <circle class="blink" cx="620" cy="136" r="3" fill="#2f9c8f"/>
  </g>

  <!-- 4 · Track: gauge + swinging needle -->
  <path d="M 800 160 A 25 25 0 0 1 850 160" fill="none" stroke="#e2e0d9" stroke-width="7" stroke-linecap="round"/>
  <path d="M 800 160 A 25 25 0 0 1 825 135" fill="none" stroke="#2f9c8f" stroke-width="7" stroke-linecap="round"/>
  <g>
    <line x1="825" y1="160" x2="825" y2="140" stroke="#2f3350" stroke-width="2.4" stroke-linecap="round">
      <animateTransform class="anim" attributeName="transform" type="rotate"
        values="-30 825 160; 34 825 160; -30 825 160" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <circle cx="825" cy="160" r="3.4" fill="#2f3350"/>
  </g>

  <!-- 5 · See: dashboard monitor -->
  <g>
    <rect x="1018" y="122" width="64" height="46" rx="4" fill="#ffffff" stroke="#283044" stroke-width="1.5"/>
    <rect x="1018" y="122" width="64" height="10" rx="4" fill="#eceae3"/>
    <circle cx="1026" cy="127" r="1.8" fill="#e0a43b"/><circle cx="1033" cy="127" r="1.8" fill="#2f9c8f"/>
    <polyline points="1024,160 1036,151 1048,155 1061,140 1076,134" fill="none" stroke="#2f9c8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1050" y1="168" x2="1050" y2="176" stroke="#283044" stroke-width="1.5"/>
    <line x1="1038" y1="176" x2="1062" y2="176" stroke="#283044" stroke-width="1.5"/>
  </g>

  <!-- dividers + technical sublabels (inside cards) -->
  <g stroke="#eceae3" stroke-width="1">
    <line x1="80"  y1="186" x2="220"  y2="186"/>
    <line x1="305" y1="186" x2="445"  y2="186"/>
    <line x1="530" y1="186" x2="670"  y2="186"/>
    <line x1="755" y1="186" x2="895"  y2="186"/>
    <line x1="980" y1="186" x2="1120" y2="186"/>
  </g>
  <g font-size="11" fill="#5c6175" text-anchor="middle">
    <text x="150"  y="204">customer order</text>
    <text x="375"  y="204">BOM · routing (ERP-lite)</text>
    <text x="600"  y="204">work order (MES)</text>
    <text x="825"  y="204">OEE · traceability · holds</text>
    <text x="1050" y="204">dashboards &amp; reports</text>
  </g>

  <!-- footer caption (layman) -->
  <text class="plain" x="600" y="250" font-size="12.5" fill="#283044" text-anchor="middle">In plain terms — the software plans a job, sends it to the floor, watches quality, and shows the results on one screen.</text>
  <text class="plain" x="600" y="270" font-size="11.5" fill="#5c6175" text-anchor="middle" font-style="italic">A learning demo of how MES / ERP software works — not a live factory system.</text>
</svg>
