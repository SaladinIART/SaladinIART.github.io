<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized distributed inspection concept for a generic preparation process</title>
  <desc id="desc">A functional concept places verification before, during, and after generic preparation steps, with a decision controller directing pass, hold, and controlled stop states.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b2f"/><stop offset="1" stop-color="#103c56"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#2dc9bf"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}.eyebrow{font-size:19px;letter-spacing:3px;fill:#76e3dc}.title{font-size:42px;font-weight:700;fill:#f5fbff}.sub{font-size:21px;fill:#a9c2d2}.lane{fill:#0a2438;stroke:#355b73;stroke-width:2}.module{fill:#102d45;stroke:#507b96;stroke-width:2}.sensor{fill:#12394a;stroke:#29c7bd;stroke-width:3}.decision{fill:#182d47;stroke:#f2be62;stroke-width:3}.name{font-size:23px;font-weight:650;fill:#f5fbff}.detail{font-size:17px;fill:#b7cbd8}.code{font-size:16px;letter-spacing:2px;fill:#76e3dc}.flow{fill:none;stroke:#29c7bd;stroke-width:6;marker-end:url(#arrow)}.signal{fill:none;stroke:#7fa1b5;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow)}.result{font-size:20px;font-weight:700}.pass{fill:#82e1a9}.hold{fill:#ffd27a}.stop{fill:#ff9c9c}.note{font-size:18px;fill:#d6e4ec}.warn{font-size:18px;font-weight:700;fill:#ffd27a}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="72" y="76" class="eyebrow">SANITIZED ENGINEERING CONCEPT</text>
  <text x="72" y="132" class="title">Inspection is a distributed decision path</text>
  <text x="72" y="174" class="sub">The concept separates process actions from independent verification and disposition logic.</text>

  <rect x="72" y="232" width="960" height="410" rx="20" class="lane"/>
  <text x="100" y="274" class="code">GENERIC PROCESS LANE</text>
  <rect x="110" y="360" width="180" height="126" rx="14" class="module"/>
  <text x="137" y="402" class="name">Input state</text><text x="137" y="439" class="detail">Identity + condition</text>
  <path d="M290 423H354" class="flow"/>
  <rect x="356" y="360" width="180" height="126" rx="14" class="module"/>
  <text x="383" y="402" class="name">Prepare</text><text x="383" y="439" class="detail">Controlled action</text>
  <path d="M536 423H600" class="flow"/>
  <rect x="602" y="360" width="180" height="126" rx="14" class="module"/>
  <text x="629" y="402" class="name">Identify</text><text x="629" y="439" class="detail">Mark + associate</text>
  <path d="M782 423H846" class="flow"/>
  <rect x="848" y="360" width="150" height="126" rx="14" class="module"/>
  <text x="875" y="402" class="name">Output</text><text x="875" y="439" class="detail">Known state</text>

  <rect x="110" y="528" width="180" height="78" rx="12" class="sensor"/>
  <text x="137" y="560" class="code">CHECK A</text><text x="137" y="586" class="detail">Input verification</text>
  <rect x="479" y="528" width="180" height="78" rx="12" class="sensor"/>
  <text x="506" y="560" class="code">CHECK B</text><text x="506" y="586" class="detail">In-process state</text>
  <rect x="818" y="528" width="180" height="78" rx="12" class="sensor"/>
  <text x="845" y="560" class="code">CHECK C</text><text x="845" y="586" class="detail">Output verification</text>

  <rect x="1090" y="298" width="438" height="344" rx="20" class="decision"/>
  <text x="1122" y="342" class="code">DECISION CONTROLLER</text>
  <text x="1122" y="390" class="name">Combine independent evidence</text>
  <text x="1122" y="430" class="detail">• Recipe and identity agreement</text>
  <text x="1122" y="462" class="detail">• Sensor health and calibration state</text>
  <text x="1122" y="494" class="detail">• Process-completion evidence</text>
  <text x="1122" y="526" class="detail">• Defined uncertainty response</text>
  <text x="1122" y="580" class="result pass">PASS</text>
  <text x="1245" y="580" class="result hold">HOLD</text>
  <text x="1370" y="580" class="result stop">CONTROLLED STOP</text>

  <path d="M290 567C620 720 1000 720 1120 610" class="signal"/>
  <path d="M659 567C850 660 1030 650 1120 575" class="signal"/>
  <path d="M998 567C1050 570 1080 557 1120 540" class="signal"/>

  <text x="72" y="743" class="code">VALIDATION QUESTIONS</text>
  <text x="72" y="785" class="note">Can each check detect the intended failure? How is uncertainty handled? Can the decision be traced and repeated?</text>
  <text x="72" y="835" class="warn">CONCEPT ONLY — OPTICS, TOLERANCES, CALIBRATION, SAFETY, AND REJECT HANDLING REQUIRE TRIALS AND APPROVAL</text>
  <text x="72" y="870" class="note">All scenarios are invented or generalized. No production capability or inspection-accuracy result is claimed.</text>
</svg>
