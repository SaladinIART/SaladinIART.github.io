<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized modular tube-preparation functional concept</title>
  <desc id="desc">A generic material path passes through verification, feed and measurement, identification, guarded separation, inspection, output handling, and kitting. All inputs are invented and the drawing is not a build drawing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2f"/>
      <stop offset="1" stop-color="#103c56"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6 0 12Z" fill="#29c7bd"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}.eyebrow{font-size:19px;letter-spacing:3px;fill:#76e3dc}.title{font-size:42px;font-weight:700;fill:#f5fbff}.sub{font-size:21px;fill:#a9c2d2}.station{fill:#102d45;stroke:#4c7894;stroke-width:2}.stationAccent{fill:#12394a;stroke:#29c7bd;stroke-width:3}.code{font-size:16px;letter-spacing:2px;fill:#76e3dc}.name{font-size:24px;font-weight:650;fill:#f5fbff}.detail{font-size:17px;fill:#b7cbd8}.flow{fill:none;stroke:#29c7bd;stroke-width:6;marker-end:url(#arrow)}.logic{fill:none;stroke:#7fa1b5;stroke-width:3;stroke-dasharray:9 9;marker-end:url(#arrow)}.boundary{fill:#0a2438;stroke:#355b73;stroke-width:2}.note{font-size:18px;fill:#d6e4ec}.warn{font-size:18px;font-weight:700;fill:#ffd27a}.chip{fill:#0c263c;stroke:#355b73;stroke-width:2}.chipText{font-size:16px;fill:#b7cbd8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="72" y="76" class="eyebrow">SANITIZED ENGINEERING CONCEPT</text>
  <text x="72" y="132" class="title">Modular preparation cell · functional flow</text>
  <text x="72" y="174" class="sub">Generic decomposition for comparing manual aids, assisted stations, and staged automation.</text>

  <rect x="72" y="232" width="1456" height="386" rx="20" class="boundary"/>
  <text x="100" y="270" class="code">GENERIC MATERIAL PATH</text>

  <rect x="105" y="318" width="185" height="168" rx="14" class="station"/>
  <text x="130" y="354" class="code">VERIFY</text>
  <text x="130" y="394" class="name">Material input</text>
  <text x="130" y="428" class="detail">Identity and state</text>
  <text x="130" y="454" class="detail">checked before flow</text>

  <path d="M290 402H348" class="flow"/>
  <rect x="350" y="318" width="185" height="168" rx="14" class="stationAccent"/>
  <text x="375" y="354" class="code">MEASURE</text>
  <text x="375" y="394" class="name">Feed + verify</text>
  <text x="375" y="428" class="detail">Independent motion</text>
  <text x="375" y="454" class="detail">measurement channel</text>

  <path d="M535 402H593" class="flow"/>
  <rect x="595" y="318" width="185" height="168" rx="14" class="station"/>
  <text x="620" y="354" class="code">IDENTIFY</text>
  <text x="620" y="394" class="name">Mark + label</text>
  <text x="620" y="428" class="detail">Recipe-controlled</text>
  <text x="620" y="454" class="detail">position and artwork</text>

  <path d="M780 402H838" class="flow"/>
  <rect x="840" y="318" width="185" height="168" rx="14" class="station"/>
  <text x="865" y="354" class="code">SEPARATE</text>
  <text x="865" y="394" class="name">Guarded cut</text>
  <text x="865" y="428" class="detail">Interlocked action</text>
  <text x="865" y="454" class="detail">and controlled release</text>

  <path d="M1025 402H1083" class="flow"/>
  <rect x="1085" y="318" width="185" height="168" rx="14" class="stationAccent"/>
  <text x="1110" y="354" class="code">INSPECT</text>
  <text x="1110" y="394" class="name">Distributed checks</text>
  <text x="1110" y="428" class="detail">Presence, position,</text>
  <text x="1110" y="454" class="detail">identity, and length</text>

  <path d="M1270 402H1328" class="flow"/>
  <rect x="1330" y="318" width="165" height="168" rx="14" class="station"/>
  <text x="1355" y="354" class="code">OUTPUT</text>
  <text x="1355" y="394" class="name">Handle + kit</text>
  <text x="1355" y="428" class="detail">Segregated result</text>
  <text x="1355" y="454" class="detail">and traceable state</text>

  <path d="M1178 486V538H1412V488" class="logic"/>
  <text x="1220" y="572" class="detail">PASS / HOLD state follows the item</text>

  <rect x="72" y="660" width="452" height="104" rx="14" class="chip"/>
  <text x="98" y="698" class="code">DECISION PURPOSE</text>
  <text x="98" y="735" class="note">Locate proof points before selecting mechanisms.</text>
  <rect x="547" y="660" width="452" height="104" rx="14" class="chip"/>
  <text x="573" y="698" class="code">EVIDENCE BOUNDARY</text>
  <text x="573" y="735" class="note">No production baseline or outcome is claimed.</text>
  <rect x="1022" y="660" width="506" height="104" rx="14" class="chip"/>
  <text x="1048" y="698" class="code">VALIDATION GATE</text>
  <text x="1048" y="735" class="note">Safety, quality, trials, and approvals remain open.</text>

  <text x="72" y="826" class="warn">FUNCTIONAL CONCEPT — NOT BUILD DRAWINGS</text>
  <text x="72" y="860" class="note">All inputs and geometry are invented or generalized. Unvalidated and unaffiliated with any employer or production line.</text>
</svg>
